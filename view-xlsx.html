      :root {
        --display: 'Iowan Old Style', 'Literata', Georgia, serif;
        --body: 'Source Sans 3', system-ui, sans-serif;
        --mono: 'IBM Plex Mono', ui-monospace, monospace;

        --paper: #f6f2e9;
        --paper-raised: #fffdf8;
        --text: #231f18;
        --muted: #6d665a;
        --brass: #8a6a23;
        --brass-bright: #b08b31;
        --line: #ddd5c4;

        --bg: var(--paper);
        --surface: var(--paper-raised);
        --max-w: 46rem;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #14120e;
          --surface: #1c1a15;
          --text: #ece7db;
          --muted: #9b9484;
          --brass: #b08b31;
          --brass-bright: #d4ad54;
          --line: #342f25;
          color-scheme: dark;
        }
      }

      :root[data-theme='dark'] {
        --bg: #14120e;
        --surface: #1c1a15;
        --text: #ece7db;
        --muted: #9b9484;
        --brass: #b08b31;
        --brass-bright: #d4ad54;
        --line: #342f25;
        color-scheme: dark;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Pasek z menu ma tło przez całą szerokość strony, a body ma tu
         dopełnienie boczne - podajemy mu, o ile ma z niego wyjść. Reguły
         paska są w assets/pasek.css, wspólnym z resztą serwisu. */
      :root {
        --pasek-wyjscie-l: max(16px, env(safe-area-inset-left, 0px));
        --pasek-wyjscie-r: max(16px, env(safe-area-inset-right, 0px));
      }

      body {
        font-family: var(--body);
        font-size: 1.0625rem;
        font-weight: 400;
        line-height: 1.75;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        /* Bez dopełnienia u góry - tak samo jak w assets/view.css. Pasek jest
           pierwszym elementem strony i dokłada swoje własne. */
        padding: 0 max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
      }


      #content {
        /* Strona arkusza nie ma kolumny tekstu - tabela ma być szeroka. */
        margin: 0 auto;
        padding: 2.5rem 0 5rem;
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
      }
      #content.loaded {
        opacity: 1;
        transform: none;
      }

      #content h1 {
        font-family: var(--display);
        font-size: clamp(2rem, 5vw, 2.9rem);
        font-weight: 600;
        line-height: 1.12;
        margin: 0 0 1.75rem;
      }
      #content h2 {
        font-family: var(--display);
        font-size: 1.65rem;
        font-weight: 600;
        line-height: 1.25;
        margin: 2.75rem 0 0.85rem;
        padding-bottom: 0.35rem;
        border-bottom: 1px solid var(--line);
      }
      #content h3 {
        font-family: var(--display);
        font-size: 1.3rem;
        font-weight: 600;
        margin: 2rem 0 0.5rem;
      }
      #content h4,
      #content h5,
      #content h6 {
        font-family: var(--mono);
        font-size: 0.74rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 1.75rem 0 0.5rem;
      }

      #content p {
        margin: 0 0 1.2rem;
      }
      #content strong {
        font-weight: 600;
      }
      #content em {
        font-style: italic;
      }

      #content a {
        color: var(--brass);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
        text-decoration-color: color-mix(
          in srgb,
          var(--brass) 45%,
          transparent
        );
      }
      #content a:hover {
        color: var(--brass-bright);
        text-decoration-color: currentColor;
      }

      #content ul,
      #content ol {
        margin: 0 0 1.2rem 1.4rem;
      }
      #content li {
        margin-bottom: 0.4rem;
      }
      #content li::marker {
        color: var(--brass);
      }
      #content li > ul,
      #content li > ol {
        margin-top: 0.4rem;
        margin-bottom: 0;
      }

      #content blockquote {
        margin: 1.75rem 0;
        padding: 0.85rem 1.25rem;
        border-left: 2px solid var(--brass);
        background: var(--surface);
        color: var(--muted);
      }
      #content blockquote p:last-child {
        margin-bottom: 0;
      }

      #content code {
        font-family: var(--mono);
        font-size: 0.82em;
        color: var(--brass);
        background: var(--surface);
        padding: 0.12em 0.4em;
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      #content pre {
        margin: 1.75rem 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 4px;
        overflow: hidden;
      }
      #content pre code {
        display: block;
        padding: 1.1rem 1.25rem;
        border: none;
        color: var(--text);
        font-size: 0.82rem;
        line-height: 1.6;
        overflow-x: auto;
      }

      #content table {
        width: 100%;
        margin: 1.75rem 0;
        border-collapse: collapse;
        font-size: 0.95rem;
      }
      #content th {
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        text-align: left;
        color: var(--muted);
        font-weight: 400;
        padding: 0.55rem 0.85rem;
        border-bottom: 1px solid var(--brass);
      }
      #content td {
        padding: 0.6rem 0.85rem;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      #content hr {
        border: none;
        border-top: 1px solid var(--line);
        margin: 2.75rem 0;
      }
      #content img {
        display: block;
        width: 100%;
        max-width: 100%;
        height: auto;
        margin: 1.75rem 0;
      }

      .state {
        max-width: var(--max-w);
        margin: 0 auto;
        padding: 4rem 0;
        text-align: center;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .state strong {
        display: block;
        font-family: var(--display);
        font-size: 1.4rem;
        letter-spacing: 0;
        text-transform: none;
        color: var(--text);
        margin-bottom: 0.6rem;
        font-weight: 600;
      }

      @media print {
        @page {
          margin: 2cm 1.6cm;
        }
        body {
          background: #fff;
          color: #000;
          font-size: 11pt;
          line-height: 1.5;
          padding: 0;
        }
        .topbar,
        #content {
          max-width: 100%;
          padding: 0;
          opacity: 1;
          transform: none;
        }
        #content h2 {
          font-size: 14pt;
        }
        #content a {
          color: #000;
        }
      }

      @media (max-width: 600px) {
        body {
          font-size: 1rem;
        }
        #content {
          padding: 2rem 0 3.5rem;
        }
        #content h2 {
          font-size: 1.4rem;
        }
      }
    </style>
    <style>
      /* widok arkusza */
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin: 0 0 1.5rem;
        padding: 0;
        list-style: none;
      }
      .tabs button {
        font: inherit;
        font-family: var(--mono);
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        padding: 0.45rem 0.85rem;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--rule);
        cursor: pointer;
      }
      .tabs button[aria-current='true'] {
        color: var(--brass);
        border-color: var(--brass);
      }
      /* Wspólna stopka ogranicza się do --max-w; tutaj ma iść przez całą stronę. */
      konstela-stopka {
        --max-w: none;
      }
      .sheet-wrap {
        overflow-x: auto;
        border: 1px solid var(--rule);
      }
      table.sheet {
        border-collapse: collapse;
        font-family: var(--mono);
        font-size: 0.78rem;
        table-layout: auto;
        min-width: 100%;
      }
      table.sheet td {
        border-right: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        padding: 0.4rem 0.6rem;
        vertical-align: top;
        white-space: pre-wrap;
        max-width: 30rem;
        min-width: 3rem;
      }
      table.sheet td:first-child {
        min-width: 14rem;
      }
      table.sheet td.num {
        text-align: right;
        white-space: nowrap;
      }
      table.sheet td.b { font-weight: 700; color: var(--ink); }
      table.sheet td.fill { background: rgba(201, 162, 74, 0.14); }
      table.sheet tr:hover td { background: rgba(138, 106, 35, 0.05); }
      .legend {
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--muted);
        margin: 0.9rem 0 0;
      }
      .legend .box {
        display: inline-block;
        width: 0.8em;
        height: 0.8em;
        background: rgba(201, 162, 74, 0.14);
        border: 1px solid var(--rule);
        margin-right: 0.35em;
        vertical-align: -0.05em;
      }
    </style>

    <!-- Tryb czytelności ustawiamy przed pierwszym rysowaniem strony,
         inaczej mignęłaby w zwykłych kolorach. Patrz assets/czytelnosc.js. -->
    <script>
      try {
        if (localStorage.getItem('konstela-czytelnosc')) {
          document.documentElement.classList.add('czytelnie');
        }
      } catch (e) {}
    </script>

    </div>

    <main id="content">
      <div class="state">Wczytywanie</div>
    </main>

    <konstela-stopka></konstela-stopka>


    <script>
      // Czytnik xlsx bez bibliotek zewnętrznych.
      // xlsx to archiwum ZIP z plikami XML; ZIP rozpakowujemy natywnie
      // przez DecompressionStream('deflate-raw'), XML przez DOMParser.
      const el = document.getElementById('content');
      // Dwie równoważne postacie adresu:
      //   /arkusz/budzet-edycji-pierwszej   - przepisywana regułą w Cloudflare
      //   /view-xlsx.html?file=budzet-...   - postać pierwotna, linki już poszły
      const params = new URLSearchParams(location.search);
      let raw = (params.get('file') || '').trim();
      if (!raw) {
        const fromPath = location.pathname.match(/^\/arkusz\/(.+?)\/?$/);
        if (fromPath) {
          try {
            raw = decodeURIComponent(fromPath[1]).trim();
          } catch (e) {
            raw = fromPath[1].trim();
          }
        }
      }

      function state(t, d) {
        el.innerHTML = '<div class="state"><strong>' + t + '</strong>' + (d || '') + '</div>';
        el.classList.add('loaded');
      }

      async function unzip(buf) {
        const dv = new DataView(buf);
        const bytes = new Uint8Array(buf);
        // koniec centralnego katalogu
        let eocd = -1;
        for (let i = bytes.length - 22; i >= 0 && i > bytes.length - 66000; i--) {
          if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
        }
        if (eocd < 0) throw new Error('To nie jest poprawny plik xlsx');
        const count = dv.getUint16(eocd + 10, true);
        let p = dv.getUint32(eocd + 16, true);
        const out = {};
        const dec = new TextDecoder();
        for (let i = 0; i < count; i++) {
          const method = dv.getUint16(p + 10, true);
          const csize = dv.getUint32(p + 20, true);
          const nlen = dv.getUint16(p + 28, true);
          const mlen = dv.getUint16(p + 30, true);
          const klen = dv.getUint16(p + 32, true);
          const lho = dv.getUint32(p + 42, true);
          const name = dec.decode(bytes.subarray(p + 46, p + 46 + nlen));
          const ln = dv.getUint16(lho + 26, true);
          const le = dv.getUint16(lho + 28, true);
          const start = lho + 30 + ln + le;
          const raw = bytes.subarray(start, start + csize);
          if (method === 0) {
            out[name] = dec.decode(raw);
          } else {
            const ds = new DecompressionStream('deflate-raw');
            const ab = await new Response(
              new Blob([raw]).stream().pipeThrough(ds)
            ).arrayBuffer();
            out[name] = dec.decode(ab);
          }
          p += 46 + nlen + mlen + klen;
        }
        return out;
      }

      const X = s => new DOMParser().parseFromString(s, 'application/xml');
      const kol = ref => {
        let n = 0;
        for (const ch of ref.replace(/[0-9]/g, '')) n = n * 26 + (ch.charCodeAt(0) - 64);
        return n;
      };

      function odczytaj(files) {
        // teksty wspólne
        let sst = [];
        if (files['xl/sharedStrings.xml']) {
          sst = [...X(files['xl/sharedStrings.xml']).getElementsByTagName('si')].map(si =>
            [...si.getElementsByTagName('t')].map(t => t.textContent).join('')
          );
        }
        // style: pogrubienie i wypełnienie
        const bold = [], fill = [], praw = [];
        if (files['xl/styles.xml']) {
          const st = X(files['xl/styles.xml']);
          const fonts = [...st.getElementsByTagName('fonts')[0].getElementsByTagName('font')]
            .map(f => !!f.getElementsByTagName('b').length);
          const fills = [...st.getElementsByTagName('fills')[0].getElementsByTagName('fill')]
            .map(f => {
              const fg = f.getElementsByTagName('fgColor')[0];
              const rgb = fg && fg.getAttribute('rgb');
              return !!(rgb && /F{0,2}FFF3C4|FFF3C4/i.test(rgb));
            });
          const xf = st.getElementsByTagName('cellXfs')[0];
          [...xf.getElementsByTagName('xf')].forEach(x => {
            bold.push(fonts[+x.getAttribute('fontId') || 0] || false);
            fill.push(fills[+x.getAttribute('fillId') || 0] || false);
            // wyrównanie zapisane w arkuszu - nagłówki kolumn liczbowych
            const al = x.getElementsByTagName('alignment')[0];
            praw.push(!!(al && al.getAttribute('horizontal') === 'right'));
          });
        }
        // nazwy zakładek
        const wbx = X(files['xl/workbook.xml']);
        const rels = X(files['xl/_rels/workbook.xml.rels']);
        const mapa = {};
        [...rels.getElementsByTagName('Relationship')].forEach(r => {
          mapa[r.getAttribute('Id')] = r.getAttribute('Target').replace(/^\/?xl\//, '');
        });
        return [...wbx.getElementsByTagName('sheet')].map(sh => {
          const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
          const path = 'xl/' + (mapa[rid] || '').replace(/^\//, '');
          const doc = X(files[path] || '<x/>');
          const wiersze = [...doc.getElementsByTagName('row')].map(row =>
            [...row.getElementsByTagName('c')].map(c => {
              const r = c.getAttribute('r') || '';
              const s = +c.getAttribute('s') || 0;
              const t = c.getAttribute('t');
              const v = c.getElementsByTagName('v')[0];
              const is = c.getElementsByTagName('is')[0];
              let val = '';
              if (t === 's' && v) val = sst[+v.textContent] ?? '';
              else if (t === 'inlineStr' && is) val = is.textContent;
              else if (v) val = v.textContent;
              const liczba = val !== '' && t !== 's' && t !== 'inlineStr' && t !== 'str' && !isNaN(val);
              return { k: kol(r), w: +r.replace(/\D/g, ''), val, liczba, b: bold[s], f: fill[s], p: praw[s] };
            })
          );
          // scalone komórki: A1:F1 -> kotwica dostaje colspan/rowspan
          const scal = [...doc.getElementsByTagName('mergeCell')].map(m => {
            const [p1, p2] = m.getAttribute('ref').split(':');
            return {
              k1: kol(p1), w1: +p1.replace(/\D/g, ''),
              k2: kol(p2), w2: +p2.replace(/\D/g, ''),
            };
          });
          return { nazwa: sh.getAttribute('name'), wiersze, scal };
        });
      }

      function fmt(v) {
        const n = Number(v);
        if (!isFinite(n)) return v;
        if (Number.isInteger(n) && Math.abs(n) < 10000) return String(n);
        if (Math.abs(n) > 0 && Math.abs(n) < 1) return (n * 100).toFixed(0) + '%';
        return n.toLocaleString('pl-PL', {
          minimumFractionDigits: Number.isInteger(n) ? 0 : 2,
          maximumFractionDigits: 2,
        });
      }

      // Nazwa zakładki w adresie: ?tab=antologii albo kotwica #antologii.
      // Kotwica działa zawsze, bo nie dociera do serwera; parametr zapytania
      // zależy od tego, czy reguła przepisująca go nie usuwa.
      function slug(s) {
        return String(s)
          .toLowerCase()
          .normalize('NFD')
          .replace(/[̀-ͯ]/g, '')
          .replace(/ł/g, 'l')
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-|-$/g, '');
      }
      function zadanaZakladka() {
        const z = (params.get('tab') || location.hash.replace(/^#/, '') || '').trim();
        return z ? slug(z) : '';
      }
      function indeksZakladki(arkusze) {
        const z = zadanaZakladka();
        if (!z) return 0;
        const n = arkusze.map(a => slug(a.nazwa));
        let i = n.indexOf(z);
        if (i < 0) i = n.findIndex(x => x.endsWith('-' + z));
        if (i < 0) i = n.findIndex(x => x.startsWith(z));
        return i < 0 ? 0 : i;
      }

      function render(arkusze) {
        const tabs = document.createElement('div');
        tabs.className = 'tabs';
        const host = document.createElement('div');
        const pokaz = i => {
          [...tabs.children].forEach((b, j) => b.setAttribute('aria-current', String(i === j)));
          const a = arkusze[i];
          // ostatnia kolumna z jakąkolwiek treścią - puste kolumny techniczne pomijamy
          const szer = Math.max(
            0,
            ...a.wiersze.map(w =>
              Math.max(0, ...w.filter(c => String(c.val).trim() !== '').map(c => c.k))
            )
          );
          // komórki przykryte przez scalenie pomijamy, kotwicom dajemy rozpiętość
          const kotwica = {}, przykryte = {};
          (a.scal || []).forEach(m => {
            kotwica[m.w1 + ':' + m.k1] = {
              cs: Math.min(m.k2, szer) - m.k1 + 1,
              rs: m.w2 - m.w1 + 1,
            };
            for (let r = m.w1; r <= m.w2; r++)
              for (let k = m.k1; k <= m.k2; k++)
                if (!(r === m.w1 && k === m.k1)) przykryte[r + ':' + k] = true;
          });
          let html = '<div class="sheet-wrap"><table class="sheet"><tbody>';
          a.wiersze.forEach((w, i) => {
            if (!w.length) return;
            const nrw = w[0].w;
            const mapa = {};
            w.forEach(c => (mapa[c.k] = c));
            html += '<tr>';
            for (let k = 1; k <= szer; k++) {
              if (przykryte[nrw + ':' + k]) continue;
              const c = mapa[k];
              const cl = [];
              if (c && (c.liczba || c.p)) cl.push('num');
              if (c && c.b) cl.push('b');
              if (c && c.f) cl.push('fill');
              const sp = kotwica[nrw + ':' + k];
              const atr =
                (cl.length ? ' class="' + cl.join(' ') + '"' : '') +
                (sp && sp.cs > 1 ? ' colspan="' + sp.cs + '"' : '') +
                (sp && sp.rs > 1 ? ' rowspan="' + sp.rs + '"' : '');
              html += '<td' + atr + '>' +
                (c ? (c.liczba ? fmt(c.val) : c.val).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])) : '') +
                '</td>';
            }
            html += '</tr>';
          });
          html += '</tbody></table></div>';
          html += '<p class="legend"><span class="box"></span>pola do edycji w arkuszu</p>';
          host.innerHTML = html;
        };
        arkusze.forEach((a, i) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = a.nazwa;
          b.onclick = () => {
            pokaz(i);
            // adres w pasku odzwierciedla wybraną zakładkę, bez przeskoku strony
            try {
              history.replaceState(null, '', '#' + slug(a.nazwa));
            } catch (e) {}
          };
          tabs.appendChild(b);
        });
        el.innerHTML = '';
        el.appendChild(tabs);
        el.appendChild(host);
        el.classList.add('loaded');
        pokaz(indeksZakladki(arkusze));
      }

      if (!raw) {
        state('Nie wskazano arkusza', 'Poprawny adres: /arkusz/budzet-edycji-pierwszej');
      } else if (/\.xlsx$/i.test(raw)) {
        state('Nieprawidłowy adres', 'Pomiń końcówkę .xlsx - poprawnie: /arkusz/' + raw.replace(/\.xlsx$/i, ''));
      } else if (!/^[\w-]+(?:\/[\w-]+)*$/.test(raw)) {
        state('Nieprawidłowy adres', '');
      } else if (typeof DecompressionStream === 'undefined') {
        state('Przeglądarka nie obsługuje tego widoku', 'Pobierz plik i otwórz w arkuszu kalkulacyjnym.');
      } else {
        fetch('/' + raw + '.xlsx')
          .then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.arrayBuffer(); })
          .then(unzip)
          .then(f => { const a = odczytaj(f); document.title = raw + ' - Nagroda Konstela'; render(a); })
          .catch(e => state('Nie udało się wczytać arkusza', e.message));
      }
    </script>
    <script src="/assets/nawigacja.js?v=202610261322" defer></script>
    <script src="/assets/czytelnosc.js?v=202610261322" defer></script>
    <script src="/assets/pasek.js?v=202610261322" defer></script>
    <script src="/assets/stopka.js?v=202610261322" defer></script>
  </body>
</html>
