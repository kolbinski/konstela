      :root {
        --display: 'Cormorant Garamond', Georgia, serif;
        --body: 'Source Sans 3', system-ui, sans-serif;
        --mono: 'IBM Plex Mono', ui-monospace, monospace;

        --paper: #f6f2e9;
        --paper-raised: #fffdf8;
        --text: #231f18;
        --muted: #6d665a;
        --brass: #8a6a23;
        --brass-bright: #b08b31;
        --line: #ddd5c4;

        --bg: var(--paper);
        --surface: var(--paper-raised);
        --max-w: 46rem;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #14120e;
          --surface: #1c1a15;
          --text: #ece7db;
          --muted: #9b9484;
          --brass: #b08b31;
          --brass-bright: #d4ad54;
          --line: #342f25;
          color-scheme: dark;
        }
      }

      :root[data-theme='dark'] {
        --bg: #14120e;
        --surface: #1c1a15;
        --text: #ece7db;
        --muted: #9b9484;
        --brass: #b08b31;
        --brass-bright: #d4ad54;
        --line: #342f25;
        color-scheme: dark;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--body);
        font-size: 1.0625rem;
        font-weight: 400;
        line-height: 1.75;
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        padding: max(16px, env(safe-area-inset-top))
          max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
      }

      .masthead {
        max-width: var(--max-w);
        margin: 0 auto;
        padding: 1.5rem 0 1.25rem;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .masthead a.brand {
        font-family: var(--display);
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--text);
        text-decoration: none;
      }
      .masthead a.brand:hover {
        color: var(--brass);
      }
      .masthead .tag {
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      #content {
        max-width: var(--max-w);
        margin: 0 auto;
        padding: 2.5rem 0 5rem;
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
      }
      #content.loaded {
        opacity: 1;
        transform: none;
      }

      #content h1 {
        font-family: var(--display);
        font-size: clamp(2rem, 5vw, 2.9rem);
        font-weight: 600;
        line-height: 1.12;
        margin: 0 0 1.75rem;
        text-wrap: balance;
      }
      #content h2 {
        font-family: var(--display);
        font-size: 1.65rem;
        font-weight: 600;
        line-height: 1.25;
        margin: 2.75rem 0 0.85rem;
        padding-bottom: 0.35rem;
        border-bottom: 1px solid var(--line);
        text-wrap: balance;
      }
      #content h3 {
        font-family: var(--display);
        font-size: 1.3rem;
        font-weight: 600;
        margin: 2rem 0 0.5rem;
      }
      #content h4,
      #content h5,
      #content h6 {
        font-family: var(--mono);
        font-size: 0.74rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 1.75rem 0 0.5rem;
      }

      #content p {
        margin: 0 0 1.2rem;
      }
      #content strong {
        font-weight: 600;
      }
      #content em {
        font-style: italic;
      }

      #content a {
        color: var(--brass);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
        text-decoration-color: color-mix(
          in srgb,
          var(--brass) 45%,
          transparent
        );
      }
      #content a:hover {
        color: var(--brass-bright);
        text-decoration-color: currentColor;
      }

      #content ul,
      #content ol {
        margin: 0 0 1.2rem 1.4rem;
      }
      #content li {
        margin-bottom: 0.4rem;
      }
      #content li::marker {
        color: var(--brass);
      }
      #content li > ul,
      #content li > ol {
        margin-top: 0.4rem;
        margin-bottom: 0;
      }

      #content blockquote {
        margin: 1.75rem 0;
        padding: 0.85rem 1.25rem;
        border-left: 2px solid var(--brass);
        background: var(--surface);
        color: var(--muted);
      }
      #content blockquote p:last-child {
        margin-bottom: 0;
      }

      #content code {
        font-family: var(--mono);
        font-size: 0.82em;
        color: var(--brass);
        background: var(--surface);
        padding: 0.12em 0.4em;
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      #content pre {
        margin: 1.75rem 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 4px;
        overflow: hidden;
      }
      #content pre code {
        display: block;
        padding: 1.1rem 1.25rem;
        border: none;
        color: var(--text);
        font-size: 0.82rem;
        line-height: 1.6;
        overflow-x: auto;
      }

      #content table {
        width: 100%;
        margin: 1.75rem 0;
        border-collapse: collapse;
        font-size: 0.95rem;
      }
      #content th {
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        text-align: left;
        color: var(--muted);
        font-weight: 400;
        padding: 0.55rem 0.85rem;
        border-bottom: 1px solid var(--brass);
      }
      #content td {
        padding: 0.6rem 0.85rem;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      #content hr {
        border: none;
        border-top: 1px solid var(--line);
        margin: 2.75rem 0;
      }
      #content img {
        max-width: 100%;
        height: auto;
        margin: 1.75rem 0;
      }

      .state {
        max-width: var(--max-w);
        margin: 0 auto;
        padding: 4rem 0;
        text-align: center;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .state strong {
        display: block;
        font-family: var(--display);
        font-size: 1.4rem;
        letter-spacing: 0;
        text-transform: none;
        color: var(--text);
        margin-bottom: 0.6rem;
        font-weight: 600;
      }

      .foot {
        max-width: var(--max-w);
        margin: 0 auto;
        padding: 1.5rem 0 2.5rem;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .foot a {
        color: var(--muted);
        text-decoration: none;
      }
      .foot a:hover {
        color: var(--brass);
      }

      @media print {
        @page {
          margin: 2cm 1.6cm;
        }
        body {
          background: #fff;
          color: #000;
          font-size: 11pt;
          line-height: 1.5;
          padding: 0;
        }
        .masthead,
        .foot {
          border-color: #ccc;
        }
        #content {
          max-width: 100%;
          padding: 0;
          opacity: 1;
          transform: none;
        }
        #content h2 {
          font-size: 14pt;
        }
        #content a {
          color: #000;
        }
      }

      @media (max-width: 600px) {
        body {
          font-size: 1rem;
        }
        #content {
          padding: 2rem 0 3.5rem;
        }
        #content h2 {
          font-size: 1.4rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="masthead">
      <a class="brand" href="/">Nagroda Konstela</a>
      <span class="tag">nagroda za rozmowy z AI</span>
    </header>

    <main id="content">
      <div class="state">Wczytywanie</div>
    </main>

    <footer class="foot">
      <a href="/">konstela.org</a>
    </footer>

    <script>
      marked.setOptions({ gfm: true, breaks: true });

      const params = new URLSearchParams(window.location.search);
      const el = document.getElementById('content');

      // Parametr podaje się bez rozszerzenia: ?file=regulamin
      // Końcówkę .md dopisuje skrypt; w adresie nie może jej być.
      const raw = (params.get('file') || '').trim();

      function state(title, detail) {
        el.innerHTML =
          '<div class="state"><strong>' +
          title +
          '</strong>' +
          (detail || '') +
          '</div>';
        el.classList.add('loaded');
      }

      if (!raw) {
        state('Nie wskazano dokumentu', 'Użyj ?file=regulamin');
      } else if (/\.md$/i.test(raw)) {
        state(
          'Nieprawidłowy adres dokumentu',
          'Pomiń końcówkę .md — poprawnie: ?file=' + raw.replace(/\.md$/i, '')
        );
      } else if (!/^[\w-]+(?:\/[\w-]+)*$/.test(raw)) {
        state('Nieprawidłowy adres dokumentu', '');
      } else {
        const file = raw + '.md';
        fetch(file)
          .then(r => {
            if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
            return r.text();
          })
          .then(md => {
            el.innerHTML = marked.parse(md);
            const h1 = el.querySelector('h1');
            if (h1) document.title = h1.textContent + ' - Nagroda Konstela';
            el.classList.add('loaded');
          })
          .catch(err => state('Nie udało się wczytać dokumentu', err.message));
      }
    </script>
  </body>
</html>
