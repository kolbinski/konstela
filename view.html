    <!-- Tryb czytelności ustawiamy przed pierwszym rysowaniem strony,
         inaczej mignęłaby w zwykłych kolorach. Patrz assets/czytelnosc.js. -->
    <script>
      try {
        if (localStorage.getItem('konstela-czytelnosc')) {
          document.documentElement.classList.add('czytelnie');
        }
      } catch (e) {}
    </script>

    <div class="topbar">
      <div class="topbar-in">
        <span class="left">
          <a class="back" href="/" aria-label="Wróć na stronę główną"><!--ikona:strzalka-wstecz--><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg><!--/ikona--></a>
          <a class="brand" href="/">Nagroda Konstela</a>
        </span>
        <span class="prawa">

          id="czytelnosc"

          type="button"

      <nav id="menu" class="menu" aria-label="Paragrafy dokumentu" hidden></nav>
