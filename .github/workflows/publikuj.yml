# Publikowanie strony konstela.org
#
# Przy każdym wrzuceniu plików na gałąź główną: generuje strony dokumentów
# z plików .md i publikuje całość na GitHub Pages. Dzięki temu nie trzeba
# pamiętać o żadnym kroku budowania - wrzucasz .md i tyle.
#
# Jednorazowe ustawienie, bez którego to nie zadziała:
# Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# GDY WDROŻENIE SIĘ WYWALI: uruchom ponownie CAŁY przebieg ("Re-run all jobs"),
# nigdy samo nieudane zadanie. Budowanie i wdrażanie siedzą w jednym zadaniu,
# więc ponowienie wrzuca drugą paczkę o nazwie "github-pages", a wdrożenie
# odmawia wtedy pracy: "Multiple artifacts named github-pages". Wariant
# odporny na ponawianie, z budowaniem i wdrażaniem jako osobnymi zadaniami,
# leży w skrypty/deploy-warianty/publikuj-dwa-zadania.yml - jest o jakieś
# 20 sekund wolniejszy, bo wdrożenie czeka na drugą maszynę.

name: Publikuj stronę

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jeśli wrzucisz kilka zmian pod rząd, liczy się ostatnia.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publikuj:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.wdrozenie.outputs.page_url }}

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          # Pełna historia, bo daty w mapie strony biorą się z historii Git,
          # a nie z czasu modyfikacji pliku na dysku.
          fetch-depth: 0

      - name: Przygotuj Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Zainstaluj bibliotekę do markdown
        run: npm install --no-save --no-audit --no-fund marked@12.0.2 hyphen@1.14.1 exceljs@4.4.0

      - name: Zbuduj strony dokumentów
        env:
          # Znacznik przy adresach plików w assets, wymuszający pobranie
          # świeżej wersji zamiast tej z pamięci przeglądarki. Skrót numeru
          # zmiany zmienia się sam, więc nie trzeba go podbijać ręcznie.
          ZNACZNIK_ZASOBOW: ${{ github.sha }}
        run: node skrypty/buduj-dokumenty.js

      - name: Zbuduj strony arkuszy
        # Arkusze trafiają na stronę jako gotowy HTML, żeby kosztorys dało się
        # przeczytać bez JavaScriptu. Skrypt strony, jeżeli się wykona,
        # zastępuje wersję statyczną układem z zakładkami.
        run: node skrypty/buduj-arkusze.js

      - name: Usuń rzeczy, których nie publikujemy
        run: rm -rf node_modules .github skrypty

      - name: Przygotuj paczkę
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Opublikuj
        id: wdrozenie
        uses: actions/deploy-pages@v4
